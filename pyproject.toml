[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-telegram-alerts"
dynamic = ["version"]
description = "Generic Telegram alerts and owner handoffs for agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Agent Telegram Alerts contributors"}]
keywords = ["agents", "telegram", "notifications"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nephilus/agent-telegram-alerts"
Issues = "https://github.com/nephilus/agent-telegram-alerts/issues"
Security = "https://github.com/nephilus/agent-telegram-alerts/security/policy"
Changelog = "https://github.com/nephilus/agent-telegram-alerts/blob/main/CHANGELOG.md"

[project.scripts]
telegram-alerts = "telegram_alerts:cli"
jcode-telegram = "telegram_alerts:legacy_cli"
telegram-alerts-jcode = "legacy_jcode:cli"
telegram-alerts-hook = "hook_install:cli"
jcode-telegram-hook = "hook_install:cli"

[tool.setuptools]
py-modules = ["telegram_alerts", "legacy_jcode", "alert_home", "alert_format", "alert_links", "alert_policy", "alert_attention", "alert_selector", "hook_install"]

[tool.setuptools.data-files]
"share/telegram-alerts/prompts" = ["prompts/owner-workflow.md"]
"share/telegram-alerts/prompts/clef" = ["prompts/clef/manifest.json"]
"share/telegram-alerts/skills/owner-review" = ["skills/owner-review/SKILL.md"]
"share/telegram-alerts/skills/owner-review/references" = ["skills/owner-review/references/inbox.md"]
"share/telegram-alerts/skills/telegram" = ["skills/telegram/SKILL.md"]

[tool.setuptools.dynamic]
version = {file = ["version.txt"]}
