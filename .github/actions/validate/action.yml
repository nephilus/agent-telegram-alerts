name: Validate package
description: Run offline tests and smoke-test an installed wheel in isolation
runs:
  using: composite
  steps:
    - name: Install pinned build tooling
      shell: bash
      run: python -m pip install -r requirements-dev.txt
    - name: Unit tests
      shell: bash
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: python -m unittest discover -v
    - name: Build wheel and source distribution
      shell: bash
      run: python -m build
    - name: Installed CLI smoke test
      shell: bash
      run: |
        set -euo pipefail
        smoke_dir=$(mktemp -d)
        trap 'rm -rf "$smoke_dir"' EXIT
        python -m venv "$smoke_dir/venv"
        "$smoke_dir/venv/bin/python" -m pip install --no-deps dist/*.whl
        export JCODE_HOME="$smoke_dir/jcode"
        mkdir -p "$JCODE_HOME"
        cd "$smoke_dir"
        "$smoke_dir/venv/bin/jcode-telegram" --help
        "$smoke_dir/venv/bin/jcode-telegram" --version
        "$smoke_dir/venv/bin/jcode-telegram" preview
        for event in session_start turn_start completion error session_end; do
          "$smoke_dir/venv/bin/jcode-telegram" preview --event "$event"
        done
        "$smoke_dir/venv/bin/jcode-telegram" policy
        "$smoke_dir/venv/bin/jcode-telegram" policy attention --enable completion --cooldown-seconds 300
        "$smoke_dir/venv/bin/jcode-telegram" policy balanced --status-card off
        "$smoke_dir/venv/bin/jcode-telegram-hook" --help
        "$smoke_dir/venv/bin/jcode-telegram-hook" dedupe-moshi
        "$smoke_dir/venv/bin/jcode-telegram-hook" install
        "$smoke_dir/venv/bin/jcode-telegram-hook" status
        "$smoke_dir/venv/bin/jcode-telegram-hook" uninstall
